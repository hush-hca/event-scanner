[project]
name = "eventradar"
version = "0.1.0"
description = "Read-only crypto event risk scanner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[tool.vercel]
entrypoint = "backend.app.api.main:app"
